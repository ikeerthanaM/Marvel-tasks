<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="850" height="420" style="background:#ffffff; font-family:sans-serif;">
  <!-- Title -->
  <text x="425" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">CPU Architecture: Before vs. After</text>
  
  <!-- Divider -->
  <line x1="330" y1="50" x2="330" y2="400" stroke="#ccc" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- BEFORE SECTION -->
  <text x="165" y="65" font-size="15" font-weight="bold" text-anchor="middle" fill="#555">BEFORE (Black Box View)</text>
  
  <rect x="95" y="95" width="140" height="45" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="165" y="122" font-size="13" text-anchor="middle" fill="#0d47a1">Terminal Command</text>
  
  <line x1="165" y1="140" x2="165" y2="175" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  
  <rect x="85" y="180" width="160" height="90" rx="8" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
  <text x="165" y="222" font-size="15" font-weight="bold" text-anchor="middle" fill="#e65100">CPU</text>
  <text x="165" y="242" font-size="11" text-anchor="middle" fill="#666">(Magic Brain)</text>

  <line x1="165" y1="270" x2="165" y2="305" stroke="#333" stroke-width="2"/>

  <rect x="95" y="310" width="140" height="45" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="165" y="337" font-size="13" text-anchor="middle" fill="#1b5e20">Screen Output</text>

  <!-- AFTER SECTION -->
  <text x="590" y="65" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">AFTER (Hardware Architecture)</text>

  <!-- CPU Outer Box -->
  <rect x="360" y="90" width="270" height="290" rx="10" fill="#f8f9fa" stroke="#212529" stroke-width="2.5"/>
  <text x="495" y="115" font-size="14" font-weight="bold" text-anchor="middle" fill="#212529">CPU (Execution Engine)</text>

  <!-- Program Counter -->
  <rect x="380" y="130" width="105" height="55" rx="6" fill="#e8eaf6" stroke="#3f51b5" stroke-width="1.5"/>
  <text x="432" y="153" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a237e">PC</text>
  <text x="432" y="170" font-size="10" text-anchor="middle" fill="#333">Next Instruction</text>

  <!-- Control Unit -->
  <rect x="505" y="130" width="105" height="55" rx="6" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.5"/>
  <text x="557" y="153" font-size="12" font-weight="bold" text-anchor="middle" fill="#4a148c">Control Unit</text>
  <text x="557" y="170" font-size="10" text-anchor="middle" fill="#333">Fetch &amp; Decode</text>

  <!-- Registers -->
  <rect x="380" y="210" width="230" height="60" rx="6" fill="#fff8e1" stroke="#ffb300" stroke-width="1.5"/>
  <text x="495" y="233" font-size="12" font-weight="bold" text-anchor="middle" fill="#ff6f00">Internal Registers</text>
  <text x="495" y="253" font-size="11" text-anchor="middle" fill="#333">[ A Register ]   [ D Register ]   [ M ]</text>

  <!-- ALU -->
  <rect x="380" y="295" width="230" height="65" rx="6" fill="#ffebee" stroke="#e53935" stroke-width="1.5"/>
  <text x="495" y="322" font-size="13" font-weight="bold" text-anchor="middle" fill="#b71c1c">ALU (Arithmetic Logic Unit)</text>
  <text x="495" y="342" font-size="10" text-anchor="middle" fill="#333">Executes Math &amp; Logic Gates</text>

  <!-- Buses -->
  <line x1="630" y1="180" x2="700" y2="180" stroke="#0288d1" stroke-width="2.5"/>
  <text x="665" y="172" font-size="10" font-weight="bold" text-anchor="middle" fill="#0277bd">Address Bus</text>

  <line x1="630" y1="270" x2="700" y2="270" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="665" y="262" font-size="10" font-weight="bold" text-anchor="middle" fill="#1b5e20">Data Bus</text>

  <!-- RAM & I/O -->
  <rect x="700" y="120" width="130" height="230" rx="8" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/>
  <text x="765" y="150" font-size="13" font-weight="bold" text-anchor="middle" fill="#004d40">RAM &amp; I/O</text>
  <text x="765" y="185" font-size="11" text-anchor="middle" fill="#333">Instructions</text>
  <text x="765" y="210" font-size="11" text-anchor="middle" fill="#333">Variables / Data</text>
  <line x1="715" y1="235" x2="815" y2="235" stroke="#80cbc4" stroke-width="1.5"/>
  <text x="765" y="265" font-size="11" font-weight="bold" text-anchor="middle" fill="#00695c">Memory-Mapped</text>
  <text x="765" y="285" font-size="11" text-anchor="middle" fill="#333">Screen &amp; Keyboard</text>
</svg>
